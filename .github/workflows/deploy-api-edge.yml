name: Deploy API Edge Proxy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/api-edge/**"
      - ".github/workflows/deploy-api-edge.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Edge Proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.80.0

      - name: Deploy edge proxy
        run: npx wrangler pages deploy apps/api-edge --project-name=api-test-geoapi --branch=main --commit-dirty=true
