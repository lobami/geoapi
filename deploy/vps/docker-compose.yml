services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: toroto-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - toroto_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - toroto_test_internal

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: toroto-test-api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18110:8000"
    networks:
      - toroto_test_internal

volumes:
  toroto_test_postgres_data:

networks:
  toroto_test_internal:
